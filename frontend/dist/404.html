<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PLUMB — Every Detail. On Brand.</title>
    <script>
      // Single Page Application redirect for static hosts (GitHub Pages, etc.)
      const path = window.location.pathname;
      const query = window.location.search;
      const hash = window.location.hash;
      window.location.replace('/' + (path ? '#' + path : '') + query + hash);
    </script>
    <meta http-equiv="refresh" content="0; url=/" />
  </head>
  <body>
    <p>Redirecting to <a href="/">PLUMB</a>...</p>
  </body>
</html>
