version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plumb-backend
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=true
      - LLM_PROVIDER=mock
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - plumb-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plumb-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  plumb-data:
